<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f3e9"><title>마음 탐정단 · 첫인상 너머의 이야기</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="adventure.css"></head><body><header><a href="./" aria-label="마음 탐정단 처음으로">✳ 마음 탐정단</a><span>첫인상 너머의 이야기</span><button id="help">활동 안내 ↗</button></header><main id="app"></main><dialog id="guide"><h2>탐정 수첩 사용법</h2><p>세 친구를 만나 첫 느낌을 고르고, 단서를 살펴보세요. 한 장면만 보고 그 사람 전체를 알 수 있을까요?</p><p>정답이나 순위는 없어요. 생각을 바꾸어도, 판단을 잠시 미루어도 괜찮아요.</p><p>마지막에는 나의 경험을 돌아봅니다. 실제 이름은 쓰지 않아도 되고, 떠오르지 않으면 가상 상황으로 써도 돼요.</p><p>작성 내용은 서버로 보내지지 않아요. 새로고침하면 사라지니, 마지막에 수첩을 저장해 주세요.</p><button id="closeHelp" class="primary">알겠어요</button></dialog><footer>천천히 보고, 한 번 더 묻기. <span>초등 5–6학년 · 약 10분</span></footer><script src="app.js"></script><script src="adventure.js"></script></body></html>
