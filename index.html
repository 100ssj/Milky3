<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#29283d"><title>마음 탐정단 — 마음숲의 비밀</title><link rel="stylesheet" href="game.css?v=5"><link rel="stylesheet" href="missions.css?v=5"></head><body>

<dialog id="guide"><h2>탐정의 작은 안내서</h2><p>방향키 또는 WASD로 움직이고, 친구나 단서 가까이에서 E 또는 스페이스를 눌러요. 화면의 방향 버튼과 조사 버튼도 사용할 수 있어요.</p><p>친구를 만나 첫 느낌을 고른 다음, 반짝이는 단서의 미니게임을 해결해 이야기 조각 세 개를 모으세요. 아직 모르는 건 판단을 잠시 미뤄도 괜찮아요.</p><p>실제 이름을 쓰지 않아도 돼요. 답변은 서버로 보내지지 않으며 새로고침하면 사라져요. 마지막에 수첩을 저장하세요.</p><button class="primary" id="closeHelp">알겠어요</button></dialog><button id="help" hidden>활동 안내</button><script src="app.js?v=5"></script><script src="pixel-art.js?v=5"></script><script src="missions.js?v=5"></script><script src="adventure.js?v=5"></script></body></html>
